[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transmute"
version = "0.1.0"
description = "多智能体验证式代码迁移编排引擎：任务切分（最小权限）→ 候选生成（测试门禁）→ 双智能体复核 → 可回滚可复现"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "智能交付知识工程组" }]
keywords = ["multi-agent", "code-migration", "cxx-rust", "llm", "verified", "test-gated", "orchestration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
web = ["fastapi>=0.110", "jinja2>=3.1"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
transmute = "transmute.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["transmute*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
